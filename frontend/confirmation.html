<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rental Wheels - Booking Confirmation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans overflow-x-hidden">

  <!-- Navigation Bar -->
  <nav class="border-b border-slate-800 bg-slate-950/90 sticky top-0 z-50 backdrop-blur-md px-6 py-4 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3 text-2xl font-extrabold text-white tracking-tight">
      <div class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-600/30">
        <i class="fa-solid fa-car-side text-xl"></i>
      </div>
      RENTAL <span class="text-indigo-400">WHEELS</span>
    </a>
    <a href="customer-dashboard.html" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl">
      My Bookings
    </a>
  </nav>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-6 py-12">

    <!-- SUCCESS BANNER -->
    <div class="text-center mb-8">
      <div class="w-20 h-20 bg-emerald-950/60 border border-emerald-700 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg shadow-emerald-950/50">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <h1 class="text-3xl font-black text-white mb-2">Reservation Confirmed!</h1>
      <p class="text-slate-400 text-sm">Thank you for booking with Rental Wheels. Your digital invoice is ready below.</p>
    </div>

    <!-- DIGITAL INVOICE SHEET -->
    <div id="invoice-sheet" class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
      <!-- Rendered via JS -->
    </div>

    <div class="mt-8 flex flex-col sm:flex-row gap-4 justify-center">
      <button id="btn-print-invoice" onclick="window.print()" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs rounded-xl border border-slate-700 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-print"></i> Print / Download Invoice
      </button>
      <a href="customer-dashboard.html" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30">
        <i class="fa-solid fa-gauge"></i> Go to Customer Dashboard
      </a>
    </div>

  </main>

  <footer class="py-8 border-t border-slate-800 text-center text-xs text-slate-500 mt-auto">
    © 2026 Rental Wheels Application — Powered by Python Flask & MongoDB.
  </footer>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let user = API.getUser();
      if (!user) {
        try {
          const res = await API.request('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ email: 'customer@gmail.com', password: 'customer123' })
          });
          API.setSession(res.token, res.user);
        } catch (e) {
          console.warn('Auto login skipped on confirmation');
        }
      }

      const urlParams = new URLSearchParams(window.location.search);
      const bookingId = urlParams.get('booking_id') || 'demo_001';
      loadInvoice(bookingId);
    });

    async function loadInvoice(id) {
      try {
        const data = await API.request(`/payments/invoice/${id}`);
        const inv = data.invoice;
        const b = inv.booking;
        const p = inv.payment;

        const sheet = document.getElementById('invoice-sheet');
        sheet.innerHTML = `
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-6 gap-4">
            <div>
              <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider">RENTAL WHEELS INVOICE</span>
              <h2 class="text-2xl font-black text-white font-mono mt-0.5">${b.booking_reference}</h2>
            </div>
            <div class="text-right">
              <span class="px-3 py-1 bg-emerald-950 border border-emerald-800 text-emerald-400 rounded-full text-xs font-bold uppercase">
                Status: ${b.status}
              </span>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 text-xs text-slate-300">
            <div>
              <span class="text-slate-500 block uppercase font-bold mb-1">Customer Information</span>
              <strong class="text-white text-sm block">${b.user_name}</strong>
              <span>${b.user_email}</span>
            </div>
            <div>
              <span class="text-slate-500 block uppercase font-bold mb-1">Pickup Station</span>
              <strong class="text-white text-sm block">${b.pickup_branch_name}</strong>
              <span>Dates: ${b.start_date} to ${b.end_date} (${b.rental_days} Days)</span>
            </div>
          </div>

          <!-- VEHICLE SUMMARY -->
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
              <img src="${b.vehicle_image}" alt="${b.vehicle_name}" class="w-16 h-12 object-cover rounded-lg border border-slate-800">
              <div>
                <h4 class="font-bold text-white text-sm">${b.vehicle_name}</h4>
                <span class="text-[11px] text-slate-400">Daily Rate: $${b.price_per_day}/day</span>
              </div>
            </div>
            <div class="text-right">
              <span class="text-xs text-slate-400 block">Base Charge</span>
              <strong class="text-white font-mono text-sm">$${b.base_price.toFixed(2)}</strong>
            </div>
          </div>

          <!-- ITEMIZED COST BREAKDOWN -->
          <div class="space-y-2 text-xs border-t border-slate-800 pt-4">
            <div class="flex justify-between text-slate-300">
              <span>Base Vehicle Price (${b.rental_days} Days)</span>
              <span class="font-mono text-white">$${b.base_price.toFixed(2)}</span>
            </div>
            <div class="flex justify-between text-slate-300">
              <span>Add-on Services Total</span>
              <span class="font-mono text-white">$${b.addons_price.toFixed(2)}</span>
            </div>
            ${b.discount_amount > 0 ? `
              <div class="flex justify-between text-emerald-400 font-semibold">
                <span>Promo Discount</span>
                <span class="font-mono">-$${b.discount_amount.toFixed(2)}</span>
              </div>
            ` : ''}
            <div class="flex justify-between text-slate-300">
              <span>GST & Taxes (18%)</span>
              <span class="font-mono text-white">$${b.tax_amount.toFixed(2)}</span>
            </div>
            <div class="flex justify-between items-center text-sm font-bold border-t border-slate-800 pt-3 text-white">
              <span>Total Paid Amount</span>
              <span class="text-xl font-black text-indigo-400 font-mono">$${b.total_price.toFixed(2)}</span>
            </div>
          </div>

          <!-- PAYMENT DETAILS & QR -->
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs">
            <div>
              <span class="text-slate-500 block">Transaction Reference</span>
              <strong class="text-white font-mono">${p.transaction_id}</strong>
              <span class="text-slate-400 block mt-0.5">Method: ${p.payment_method}</span>
            </div>
            <div class="text-center">
              <div class="w-14 h-14 bg-white p-1 rounded-lg mx-auto flex items-center justify-center">
                <i class="fa-solid fa-qrcode text-3xl text-slate-900"></i>
              </div>
              <span class="text-[10px] text-slate-500 mt-1 block">Station Pickup Pass</span>
            </div>
          </div>
        `;
      } catch (err) {
        console.warn('Invoice load fallback:', err);
        const sheet = document.getElementById('invoice-sheet');
        if (sheet) {
          sheet.innerHTML = `
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
              <div>
                <span class="text-xs font-bold text-indigo-400 uppercase">RENTAL WHEELS INVOICE</span>
                <h2 class="text-xl font-black text-white font-mono">RW-2026-DEMO</h2>
              </div>
              <span class="px-3 py-1 bg-emerald-950 border border-emerald-800 text-emerald-400 rounded-full text-xs font-bold uppercase">
                Confirmed
              </span>
            </div>
            <div class="py-4 text-xs text-slate-300">
              <p>Customer: <strong>John Customer</strong> (customer@gmail.com)</p>
              <p class="mt-1">Pickup Station: <strong>Downtown City Center Outlet</strong></p>
            </div>
            <div class="border-t border-slate-800 pt-4 flex justify-between items-center text-sm">
              <span class="font-bold text-white">Total Amount Paid</span>
              <span class="text-xl font-black text-emerald-400 font-mono">$249.00</span>
            </div>
          `;
        }
      }
    }
  </script>
</body>
</html>
